<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Artificial intelligence network illustration">
  <defs>
    <radialGradient id="globe" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#d8f1ff"/>
      <stop offset="0.32" stop-color="#6ec2ff"/>
      <stop offset="0.68" stop-color="#1f74f0"/>
      <stop offset="1" stop-color="#0a2f8f"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#f9fcff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1f5bea" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cardline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f74f0"/>
      <stop offset="1" stop-color="#8ecbff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2a50" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="760" fill="url(#sky)"/>

  <!-- glow field -->
  <circle cx="560" cy="330" r="300" fill="#bfe3ff" opacity="0.45"/>
  <circle cx="560" cy="330" r="220" fill="#8ac8ff" opacity="0.35"/>

  <!-- skyline -->
  <g opacity="0.5">
    <rect x="330" y="430" width="54" height="230" rx="6" fill="#cbe2fb"/>
    <rect x="392" y="470" width="44" height="190" rx="6" fill="#bcd8f7"/>
    <rect x="446" y="404" width="62" height="256" rx="6" fill="#d5e8fd"/>
    <rect x="516" y="452" width="48" height="208" rx="6" fill="#c2ddf9"/>
    <rect x="572" y="386" width="70" height="274" rx="6" fill="#dbeafd"/>
    <rect x="650" y="440" width="52" height="220" rx="6" fill="#c6dff9"/>
    <rect x="710" y="474" width="60" height="186" rx="6" fill="#d3e7fc"/>
    <rect x="778" y="418" width="66" height="242" rx="6" fill="#cde3fb"/>
    <g fill="#ffffff" opacity="0.75">
      <rect x="340" y="452" width="8" height="8"/><rect x="356" y="452" width="8" height="8"/>
      <rect x="340" y="472" width="8" height="8"/><rect x="356" y="472" width="8" height="8"/>
      <rect x="460" y="426" width="8" height="8"/><rect x="476" y="426" width="8" height="8"/>
      <rect x="460" y="446" width="8" height="8"/><rect x="476" y="446" width="8" height="8"/>
      <rect x="588" y="408" width="8" height="8"/><rect x="604" y="408" width="8" height="8"/>
      <rect x="588" y="428" width="8" height="8"/><rect x="604" y="428" width="8" height="8"/>
      <rect x="794" y="440" width="8" height="8"/><rect x="810" y="440" width="8" height="8"/>
    </g>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="url(#ring)" stroke-width="2">
    <ellipse cx="560" cy="330" rx="290" ry="112" transform="rotate(-16 560 330)"/>
    <ellipse cx="560" cy="330" rx="252" ry="96" transform="rotate(24 560 330)"/>
  </g>

  <!-- globe -->
  <circle cx="560" cy="330" r="176" fill="url(#globe)"/>
  <circle cx="560" cy="330" r="176" fill="none" stroke="#eaf6ff" stroke-width="2" opacity="0.55"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.34">
    <ellipse cx="560" cy="330" rx="176" ry="60"/>
    <ellipse cx="560" cy="330" rx="176" ry="118"/>
    <ellipse cx="560" cy="330" rx="70" ry="176"/>
    <ellipse cx="560" cy="330" rx="132" ry="176"/>
    <line x1="384" y1="330" x2="736" y2="330"/>
  </g>

  <!-- continents (abstract) -->
  <g fill="#ffffff" opacity="0.2">
    <path d="M470 250c26-14 62-10 74 10 8 15-10 26-32 34-24 9-40 4-46-12-5-14-6-26 4-32Z"/>
    <path d="M600 300c20-6 44 6 48 26 5 22-12 38-28 36-18-2-26-18-28-36-2-14 1-24 8-26Z"/>
    <path d="M520 380c22-6 44 6 46 22 2 18-14 30-32 26-16-4-22-16-22-28 0-10 3-18 8-20Z"/>
  </g>

  <!-- network nodes -->
  <g stroke="#9fd2ff" stroke-width="1.6" opacity="0.75" fill="none">
    <path d="M560 154 470 250M560 154 686 226M686 226 736 330M560 506 470 430M470 430 384 330M686 226 736 330"/>
    <path d="M470 250 384 330M520 380 470 430"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="560" cy="154" r="6" fill="#ffffff"/>
    <circle cx="686" cy="226" r="5" fill="#cdeaff"/>
    <circle cx="736" cy="330" r="6" fill="#ffffff"/>
    <circle cx="384" cy="330" r="5" fill="#cdeaff"/>
    <circle cx="470" cy="430" r="6" fill="#ffffff"/>
    <circle cx="560" cy="506" r="5" fill="#cdeaff"/>
    <circle cx="470" cy="250" r="5" fill="#ffffff"/>
  </g>

  <!-- floating UI cards -->
  <g filter="url(#soft)">
    <rect x="230" y="470" width="210" height="112" rx="14" fill="#ffffff"/>
    <rect x="252" y="492" width="92" height="9" rx="4.5" fill="url(#cardline)"/>
    <rect x="252" y="514" width="150" height="7" rx="3.5" fill="#dfeafb"/>
    <rect x="252" y="530" width="120" height="7" rx="3.5" fill="#e8f1fc"/>
    <rect x="252" y="550" width="66" height="16" rx="8" fill="#e6f1ff"/>

    <rect x="690" y="430" width="188" height="96" rx="14" fill="#ffffff"/>
    <circle cx="722" cy="464" r="14" fill="#e6f1ff"/>
    <path d="M716 464h12M722 458v12" stroke="#1f74f0" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="746" y="456" width="104" height="8" rx="4" fill="#dbe8fa"/>
    <rect x="746" y="472" width="72" height="7" rx="3.5" fill="#eaf2fd"/>
    <rect x="706" y="492" width="150" height="7" rx="3.5" fill="#f0f6fe"/>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke="#8ec6ff" stroke-width="1.6" opacity="0.6">
    <path d="M60 620h90l26 26h84"/>
    <path d="M60 660h70l30 30h104"/>
    <path d="M60 700h120"/>
  </g>
  <g fill="#6fb3ff" opacity="0.8">
    <circle cx="60" cy="620" r="4"/><circle cx="60" cy="660" r="4"/><circle cx="60" cy="700" r="4"/>
  </g>
</svg>
