<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Artificial intelligence network illustration">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04122c"/>
      <stop offset="0.45" stop-color="#0a2555"/>
      <stop offset="1" stop-color="#0f4796"/>
    </linearGradient>
    <radialGradient id="globe" cx="36%" cy="28%" r="74%">
      <stop offset="0" stop-color="#e2f8ff"/>
      <stop offset="0.3" stop-color="#7ad4ff"/>
      <stop offset="0.66" stop-color="#2196f3"/>
      <stop offset="1" stop-color="#0a3a9e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe0ff"/>
      <stop offset="1" stop-color="#2b7bff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04122c" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="760" fill="url(#night)"/>
  <circle cx="560" cy="300" r="330" fill="url(#halo)"/>

  <!-- network mesh -->
  <g stroke="#4aa8ff" stroke-width="1.1" opacity="0.35" fill="none">
    <path d="M120 120h180M300 120v120M640 90l120 70M760 160l-20 130M700 500l120 60M120 420l120 90M240 510l140 60"/>
    <path d="M60 240h120M820 300v120M520 620h160M180 620l90-80"/>
  </g>
  <g fill="#8fd4ff" opacity="0.7">
    <circle cx="120" cy="120" r="3"/><circle cx="300" cy="240" r="3"/><circle cx="640" cy="90" r="3"/>
    <circle cx="760" cy="290" r="3"/><circle cx="180" cy="620" r="3"/><circle cx="680" cy="560" r="3"/>
    <circle cx="60" cy="240" r="3"/><circle cx="820" cy="300" r="3"/>
  </g>

  <!-- skyline -->
  <g>
    <rect x="250" y="450" width="60" height="230" rx="5" fill="#0b2a5e"/>
    <rect x="320" y="490" width="46" height="190" rx="5" fill="#0e3169"/>
    <rect x="376" y="424" width="70" height="256" rx="5" fill="#123a78"/>
    <rect x="456" y="472" width="52" height="208" rx="5" fill="#0d2f63"/>
    <rect x="518" y="400" width="78" height="280" rx="5" fill="#16448a"/>
    <rect x="606" y="452" width="56" height="228" rx="5" fill="#0f356f"/>
    <rect x="672" y="486" width="64" height="194" rx="5" fill="#123a78"/>
    <rect x="746" y="430" width="74" height="250" rx="5" fill="#0d2f63"/>
    <g fill="#7fd0ff" opacity="0.55">
      <rect x="262" y="470" width="6" height="8"/><rect x="278" y="470" width="6" height="8"/>
      <rect x="262" y="492" width="6" height="8"/><rect x="278" y="492" width="6" height="8"/>
      <rect x="388" y="444" width="6" height="8"/><rect x="404" y="444" width="6" height="8"/>
      <rect x="388" y="466" width="6" height="8"/><rect x="404" y="466" width="6" height="8"/>
      <rect x="532" y="420" width="6" height="8"/><rect x="548" y="420" width="6" height="8"/>
      <rect x="532" y="442" width="6" height="8"/><rect x="548" y="442" width="6" height="8"/>
      <rect x="758" y="450" width="6" height="8"/><rect x="774" y="450" width="6" height="8"/>
      <rect x="332" y="510" width="6" height="8"/><rect x="348" y="510" width="6" height="8"/>
    </g>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="url(#ring)" stroke-width="2.2">
    <ellipse cx="560" cy="300" rx="300" ry="116" transform="rotate(-16 560 300)"/>
    <ellipse cx="560" cy="300" rx="258" ry="98" transform="rotate(24 560 300)"/>
    <ellipse cx="560" cy="300" rx="212" ry="80" transform="rotate(-46 560 300)"/>
  </g>

  <!-- globe -->
  <circle cx="560" cy="300" r="176" fill="url(#globe)" filter="url(#glow)"/>
  <g fill="none" stroke="#eaf8ff" stroke-width="1.3" opacity="0.4">
    <ellipse cx="560" cy="300" rx="176" ry="60"/>
    <ellipse cx="560" cy="300" rx="176" ry="118"/>
    <ellipse cx="560" cy="300" rx="70" ry="176"/>
    <ellipse cx="560" cy="300" rx="132" ry="176"/>
    <line x1="384" y1="300" x2="736" y2="300"/>
  </g>
  <g fill="#0b3f9f" opacity="0.35">
    <path d="M470 220c26-14 62-10 74 10 8 15-10 26-32 34-24 9-40 4-46-12-5-14-6-26 4-32Z"/>
    <path d="M600 270c20-6 44 6 48 26 5 22-12 38-28 36-18-2-26-18-28-36-2-14 1-24 8-26Z"/>
    <path d="M520 350c22-6 44 6 46 22 2 18-14 30-32 26-16-4-22-16-22-28 0-10 3-18 8-20Z"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="560" cy="124" r="5" fill="#ffffff"/>
    <circle cx="686" cy="196" r="5" fill="#d6f0ff"/>
    <circle cx="736" cy="300" r="6" fill="#ffffff"/>
    <circle cx="384" cy="300" r="5" fill="#d6f0ff"/>
    <circle cx="470" cy="400" r="6" fill="#ffffff"/>
    <circle cx="560" cy="476" r="5" fill="#d6f0ff"/>
  </g>

  <!-- floating data card -->
  <g filter="url(#soft)">
    <rect x="196" y="470" width="206" height="108" rx="14" fill="#0d2350" stroke="#2a6fd6" stroke-opacity="0.5"/>
    <rect x="218" y="492" width="92" height="9" rx="4.5" fill="#3fbcff"/>
    <rect x="218" y="514" width="148" height="7" rx="3.5" fill="#1c4a92"/>
    <rect x="218" y="530" width="116" height="7" rx="3.5" fill="#1c4a92"/>
    <rect x="218" y="550" width="64" height="15" rx="7.5" fill="#12459b"/>

    <rect x="676" y="404" width="190" height="94" rx="14" fill="#0d2350" stroke="#2a6fd6" stroke-opacity="0.5"/>
    <circle cx="708" cy="438" r="14" fill="#12459b"/>
    <path d="M702 438h12M708 432v12" stroke="#7fd0ff" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="732" y="430" width="104" height="8" rx="4" fill="#1c4a92"/>
    <rect x="732" y="446" width="72" height="7" rx="3.5" fill="#1c4a92"/>
  </g>

  <!-- light trails -->
  <g fill="none" stroke="#63c4ff" stroke-width="1.6" opacity="0.55">
    <path d="M60 620h90l26 26h84"/>
    <path d="M60 660h70l30 30h104"/>
  </g>
  <g fill="#63c4ff" opacity="0.75">
    <circle cx="60" cy="620" r="4"/><circle cx="60" cy="660" r="4"/>
  </g>
</svg>
