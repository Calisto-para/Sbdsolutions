<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · SBD Solutions</title>
<meta name="theme-color" content="#08182f">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f6f9fe; color: #08182f;
  }
  .card {
    width: min(520px, 100%); background: #fff; border: 1px solid #e3eaf6;
    border-radius: 18px; padding: 32px; box-shadow: 0 18px 44px rgba(11, 30, 60, 0.09);
    text-align: center;
  }
  img { width: 64px; height: 64px; }
  h1 { font-size: 1.5rem; margin: 18px 0 8px; letter-spacing: -0.02em; }
  p { color: #465a76; line-height: 1.6; margin: 0 0 22px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a, button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 11px 18px;
    cursor: pointer; text-decoration: none; border: 1px solid transparent;
  }
  .primary { background: #1a56f0; color: #fff; }
  .ghost { background: #fff; border-color: #cbd8ee; color: #08182f; }
  small { display: block; margin-top: 20px; color: #64748b; }
</style>
</head>
<body>
  <main class="card">
    <img src="/brand/sbd-solutions-mark.png" alt="SBD Solutions">
    <h1>You are offline</h1>
    <p>SBD Solutions needs a connection for your dashboard, messages and payments. Public pages you have already visited may still open.</p>
    <div class="actions">
      <button class="primary" type="button" onclick="location.reload()">Try again</button>
      <a class="ghost" href="/">Go to the home page</a>
    </div>
    <small>Nothing private is stored for offline use.</small>
  </main>
</body>
</html>
